# Cloudflare Pages + Functions config
# Local dev: wrangler pages dev apps/pwa/dist
# Deploy: wrangler pages deploy apps/pwa/dist
#
# KV bindings must also be configured in Cloudflare Dashboard:
# Settings > Functions > KV namespace bindings > add QUOTE_CACHE

name = "my-bills"
pages_build_output_dir = "apps/pwa/dist"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "QUOTE_CACHE"
id = "a025d8ed33bf444c9ec7df45993aae92"

[vars]
LOG_LEVEL = "1"

# DO NOT declare API keys here. [vars] deploys as Plaintext and overwrites Secrets.
# Use .dev.vars for local dev. Use wrangler pages secret put or Dashboard for production.
